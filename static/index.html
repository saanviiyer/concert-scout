<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concert Scout</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🎟️ Concert Scout</h1>
    <p class="tagline">Your listening taste → the best concert tickets, optimized for price, seats, and dates.</p>
    <div id="providerBadges" class="badges"></div>
  </header>

  <main>
    <section class="panel" id="controls">
      <h2>Taste</h2>
      <div class="row">
        <button id="btnSpotify" class="secondary">Connect Spotify</button>
        <button id="btnYtm" class="secondary">Import YouTube Music</button>
      </div>
      <label for="artists">Artists (one per line — prefilled after connecting)</label>
      <textarea id="artists" rows="6" placeholder="Mitski&#10;Phoebe Bridgers&#10;Men I Trust"></textarea>

      <h2>Search</h2>
      <label for="city">City (optional)</label>
      <input id="city" placeholder="Los Angeles">
      <div class="row">
        <div>
          <label for="startDate">From</label>
          <input id="startDate" type="date">
        </div>
        <div>
          <label for="endDate">To</label>
          <input id="endDate" type="date">
        </div>
      </div>

      <h2>Optimize for</h2>
      <label for="budget">Budget per ticket: $<span id="budgetVal">150</span></label>
      <input id="budget" type="range" min="20" max="600" step="5" value="150">
      <label for="seatPref">Cheapest ticket ⟷ Best seats: <span id="seatVal">0.3</span></label>
      <input id="seatPref" type="range" min="0" max="1" step="0.1" value="0.3">
      <label class="check"><input id="weekendPref" type="checkbox" checked> Prefer weekends</label>

      <button id="btnGo" class="primary">Find my concerts</button>
      <div id="error" class="error hidden"></div>
    </section>

    <section class="panel wide">
      <div id="results"><p class="muted">Add artists (or connect a source) and hit <b>Find my concerts</b>.</p></div>
      <details id="traceBox" class="hidden">
        <summary>Agent trace — how these picks were made</summary>
        <div id="trace"></div>
      </details>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
